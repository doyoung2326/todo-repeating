<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover가 있어야 env(safe-area-inset-*)가 실제 값을 준다. 없으면 전부 0으로 읽혀
         홈 인디케이터를 피하려고 써 둔 계산(탭바·+ 버튼·시트)이 아무 일도 하지 않는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4d6b57" />
    <title>📚 공부 할 일 관리</title>

    <!-- 기본 favicon: 이모지 SVG(빠른 시각 식별용) → 브라우저가 못 읽으면 favicon.ico로 폴백 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <!-- iOS: 웹 매니페스트를 안 읽으므로 홈 화면 추가/standalone 실행은 이 태그들로 따로 지정 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="공부투두" />
    <!-- 제목용 명조. iOS에는 쓸 만한 한글 명조가 기본 탑재돼 있지 않아서, 글꼴 목록만으로는
         어떻게 해도 고딕으로 떨어진다. 받아온 글꼴은 서비스 워커가 저장해 두므로
         (vite.config.js의 runtimeCaching) 두 번째부터는 오프라인에서도 명조로 보인다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3603524980732348"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
